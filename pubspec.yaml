name: sectioned_chip_scroll
description: >-
  Scroll-spy chip bar for sectioned lists: pinned chips track the visible
  section, tap to jump, overlay picker, accessible up to the largest text size.
version: 0.2.0
repository: https://github.com/ohyeh/sectioned_chip_scroll
issue_tracker: https://github.com/ohyeh/sectioned_chip_scroll/issues
topics:
  - scroll-spy
  - chips
  - scrolling
  - accessibility
  - widget

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.5"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
